# Temporary branch-scoped dependency remediation experiment.
# Runs only when this file itself is added/changed on the Viewer2 lab branch.
# NEVER deploys, publishes, merges or touches production hosts.
name: Viewer2 one-shot dependency remediation
on:
  push:
    branches: [feat/viewer2-readonly-lab-20261008]
    paths:
      - '.github/workflows/viewer2-dependency-fix.yml'
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Try security-only compatible dependency resolution
        run: |
          npm audit fix --package-lock-only --ignore-scripts --audit-level=high || true
          npm audit --package-lock-only --audit-level=high || true
      - name: Record proposed remediation on Viewer2 feature branch only
        env:
          BRANCH: feat/viewer2-readonly-lab-20261008
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json package.json
            git commit -m "chore(viewer2): resolve security advisories within semver"
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            echo "No compatible dependency resolution found."
          fi
