name: Full Git Secret History Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout all reachable branch and tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure all remote branches and tags are included
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git show-ref --heads --tags --quiet || git show-ref --verify refs/remotes/origin/main
      - name: Scan every reachable commit (including all refs)
        run: |
          docker run --rm --read-only \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --config=.gitleaks.toml --log-opts="--all" --redact --exit-code=1 .
      - name: Scan current working tree, including untracked files
        run: |
          docker run --rm --read-only \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            dir --config=.gitleaks.toml --redact --exit-code=1 .
